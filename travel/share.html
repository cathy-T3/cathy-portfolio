<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#edf3fa"><title>绮途 · 旅记分享</title><style>
*{box-sizing:border-box}body{margin:0;background:#e8eef5;color:#171922;font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif}.stage{min-height:100svh;padding:30px 18px 60px;position:relative;overflow:hidden;isolation:isolate}.backdrop{position:absolute;inset:-24px;z-index:-2;background:linear-gradient(135deg,#709ec1,#cedae8 50%,#7d9cb2);background-size:cover;background-position:center;filter:blur(17px) brightness(.83);transform:scale(1.05)}.stage:before{content:"";position:absolute;inset:0;z-index:-1;background:linear-gradient(180deg,#dce7f138,#dce6f0aa 55%,#e9eff4)}.brand{max-width:600px;margin:0 auto 22px;color:#fff;font-size:13px;font-weight:800;letter-spacing:.22em;text-shadow:0 2px 10px #0008}.card{max-width:600px;margin:auto;border:1px solid #ffffffb9;border-radius:32px;background:#f8fbffb6;backdrop-filter:blur(26px);-webkit-backdrop-filter:blur(26px);box-shadow:0 25px 80px #233b5b42;overflow:hidden}.hero{height:min(58vh,500px);min-height:340px;position:relative;background:linear-gradient(145deg,#86a8c8,#a8b4d2);background-position:center;background-size:cover;overflow:hidden}.hero:after{content:"";position:absolute;inset:35% 0 0;background:linear-gradient(transparent,#0b1b38b8)}.location{position:absolute;left:24px;bottom:25px;z-index:1;color:white;text-shadow:0 2px 12px #0009}.location small{display:block;letter-spacing:.15em;font-size:12px;font-weight:700}.location h1{margin:7px 0 0;font-size:clamp(38px,10vw,68px);line-height:1.1}.inset{position:absolute;right:22px;bottom:20px;z-index:2;width:31%;aspect-ratio:4/5;max-height:210px;padding:5px;background:#ffffffb8;border:1px solid #fff;border-radius:20px;box-shadow:0 15px 30px #0006;transform:rotate(5deg)}.inset img{width:100%;height:100%;object-fit:cover;border-radius:15px}.content{padding:27px 25px 32px}.meta{display:flex;flex-wrap:wrap;gap:7px;margin-bottom:17px}.meta span{padding:7px 11px;border-radius:50px;background:#ffffffa8;color:#566576;font-size:12px;font-weight:700}.content h2{margin:0 0 12px;font-size:27px}.note{white-space:pre-wrap;line-height:1.85;color:#334154;overflow-wrap:anywhere}.gallery{display:grid;grid-template-columns:repeat(2,1fr);gap:9px;margin-top:20px}.gallery img{width:100%;aspect-ratio:1/1;object-fit:cover;border-radius:16px}.gallery img:first-child:last-child{grid-column:span 2;aspect-ratio:4/3}.place-link{display:inline-flex;margin-top:22px;padding:12px 16px;border-radius:30px;background:#272c3e;color:#fff;text-decoration:none;font-weight:700;font-size:13px}.credit{display:block;margin-top:18px;font-size:11px;color:#687889}.footer{max-width:600px;margin:22px auto;color:#fff;font-size:12px;text-align:center;text-shadow:0 1px 4px #283a4a}.error{max-width:500px;margin:20vh auto;padding:30px;border-radius:22px;background:#fff}.error a{color:#7547c9}@media(max-width:400px){.inset{width:34%}.location h1{font-size:38px}}
</style></head><body><main class="stage"><div class="backdrop" id="backdrop"></div><div class="brand">✦ 绮途 · 一段旅程的故事</div><article class="card" id="card" hidden><div class="hero" id="hero"><div class="location"><small id="region"></small><h1 id="destination"></h1></div><div class="inset" id="inset" hidden><img id="insetImg" alt="旅途中的照片"></div></div><div class="content"><div class="meta" id="meta"></div><h2 id="title"></h2><div class="note" id="note"></div><div class="gallery" id="gallery"></div><a class="place-link" id="place" target="_blank" rel="noopener noreferrer">查看地点 ↗</a><a class="credit" id="credit" hidden target="_blank" rel="noopener noreferrer">城市图片来源：维基百科 ↗</a></div></article><div class="error" id="error" hidden><h1>这篇旅记暂时打不开</h1><p>链接可能不完整。请让分享者重新发送专属链接。</p></div><div class="footer">用绮途记录每一段值得记住的路</div></main><script>
const $=s=>document.querySelector(s);function safeImage(s){return typeof s==='string'&&(/^(data:image\/(jpeg|png|webp);base64,)/.test(s)||/^https:\/\/upload\.wikimedia\.org\//.test(s))?s:''}function line(value){let span=document.createElement('span');span.textContent=value;$('#meta').append(span)}async function decode(){let frag=location.hash.slice(1);if(!/^[gj][A-Za-z0-9_-]+$/.test(frag))throw Error('bad link');let b=frag.slice(1).replace(/-/g,'+').replace(/_/g,'/'),bin=atob(b),bytes=Uint8Array.from(bin,c=>c.charCodeAt(0));if(frag[0]==='g'){if(!('DecompressionStream' in window))throw Error('unsupported');bytes=new Uint8Array(await new Response(new Blob([bytes]).stream().pipeThrough(new DecompressionStream('gzip'))).arrayBuffer())}let data=JSON.parse(new TextDecoder().decode(bytes));if(data.v!==1)throw Error('version');return data}
(async()=>{try{let d=await decode(),bg=safeImage(d.cityCover)||safeImage(d.cityImage)||safeImage(d.photos?.[0]);if(bg){$('#hero').style.backgroundImage=`url("${bg}")`;$('#backdrop').style.backgroundImage=`url("${bg}")`}let portrait=safeImage(d.photos?.[0]);if(portrait){$('#insetImg').src=portrait;$('#inset').hidden=false}$('#region').textContent=[d.country,d.province].filter(Boolean).join(' · ');$('#destination').textContent=d.destination||'旅途';$('#title').textContent=d.name||d.destination||'我的旅记';$('#note').textContent=d.note||'这段旅程还没有写下心得。';document.title=($('#title').textContent)+' · 绮途';if(d.date)line(d.date);if(d.weather)line('天气 · '+d.weather);if(d.mood)line('心情 · '+d.mood);for(let src of (d.photos||[]).slice(0,3)){let safe=safeImage(src);if(!safe)continue;let img=document.createElement('img');img.src=safe;img.alt='旅途照片';$('#gallery').append(img)}let coords=Number.isFinite(Number(d.lat))&&Number.isFinite(Number(d.lon))&&d.lat!=null&&d.lon!=null;$('#place').href=coords?`https://www.openstreetmap.org/?mlat=${encodeURIComponent(d.lat)}&mlon=${encodeURIComponent(d.lon)}#map=13/${encodeURIComponent(d.lat)}/${encodeURIComponent(d.lon)}`:'https://www.openstreetmap.org/search?query='+encodeURIComponent([d.destination,d.country].filter(Boolean).join(' '));if(/^https:\/\/zh\.wikipedia\.org\/wiki\//.test(d.cityImageSource||'')){$('#credit').href=d.cityImageSource;$('#credit').hidden=false}$('#card').hidden=false}catch(e){$('#error').hidden=false}})();
</script></body></html>
